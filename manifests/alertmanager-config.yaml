route:
  receiver: gmail-alerts
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: gmail-alerts
    email_configs:
      - to: your-email@gmail.com
        from: your-email@gmail.com
        smarthost: smtp.gmail.com:587
        auth_username: your-email@gmail.com
        auth_password: YOUR_APP_PASSWORD
        require_tls: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - namespace